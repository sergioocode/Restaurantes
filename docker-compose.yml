name: restaurantes

services:
  postgres:
    image: postgres:18-alpine
    container_name: restaurantes-postgres
    environment:
      POSTGRES_USER: restaurants
      POSTGRES_PASSWORD: restaurants_dev
      POSTGRES_DB: restaurant_operations_write
    ports:
      - "5432:5432"
    volumes:
      - restaurant-postgres-data:/var/lib/postgresql
      - ./tools/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U restaurants -d restaurant_operations_write" ]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: restaurantes-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@restaurants.com
      PGADMIN_DEFAULT_PASSWORD: restaurants_dev
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    ports:
      - "5050:80"
    volumes:
      - restaurant-pgadmin-data:/var/lib/pgadmin
      - ./tools/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.3.4-management-alpine
    container_name: restaurantes-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: restaurants
      RABBITMQ_DEFAULT_PASS: restaurants_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - restaurant-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  vault:
    image: hashicorp/vault:1.21.4
    container_name: restaurantes-vault
    command: server -dev -dev-listen-address=0.0.0.0:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:?Local Vault bootstrap token is missing}
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: [ "CMD", "vault", "status" ]
      interval: 2s
      timeout: 2s
      retries: 20

  vault-init:
    image: hashicorp/vault:1.21.4
    container_name: restaurantes-vault-init
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:?Local Vault bootstrap token is missing}
    volumes:
      - ./tools/vault/init.sh:/vault/init/init.sh:ro
      - restaurant-vault-proxy-auth:/vault/auth
    depends_on:
      vault:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "/vault/init/init.sh" ]

  vault-proxy:
    image: hashicorp/vault:1.21.4
    container_name: restaurantes-vault-proxy
    command: proxy -config=/vault/config/proxy.hcl
    ports:
      - "127.0.0.1:8201:8100"
    volumes:
      - ./tools/vault/proxy.hcl:/vault/config/proxy.hcl:ro
      - restaurant-vault-proxy-auth:/vault/auth:ro
    depends_on:
      vault-init:
        condition: service_completed_successfully


volumes:
  restaurant-postgres-data:
  restaurant-pgadmin-data:
  restaurant-rabbitmq-data:
  restaurant-vault-proxy-auth:
