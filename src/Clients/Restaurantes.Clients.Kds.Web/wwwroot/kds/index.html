<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>KDS · Restaurantes</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f1f4f2">

    <link rel="stylesheet" href="css/kds.css">
    <link rel="manifest" href="manifest.webmanifest">

    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
</head>

<body>
    <main>
        <section id="authLoading" class="controls auth-loading auth-card" aria-live="polite">
            <div class="auth-brand">
                <img src="icons/icon-192.png" alt="" />
                <div><small>RESTAURANTES · COCINA</small><strong>KDS</strong></div>
            </div>
            <div class="auth-progress"><span class="auth-spinner"></span><span>Comprobando sesión…</span></div>
        </section>

        <form id="loginPanel" class="controls auth-card hidden">
            <div class="auth-brand">
                <img src="icons/icon-192.png" alt="" />
                <div><small>RESTAURANTES · COCINA</small><strong>KDS</strong></div>
            </div>
            <button id="loginMicrosoft" type="button" disabled>Continuar con Microsoft</button>
            <button id="loginGoogle" type="button" disabled>Continuar con Google</button>
        </form>

        <section id="monitorPanel" class="controls hidden">
            <div class="identity">
                <strong id="currentUserName"></strong>
            </div>
            <label class="field station-field">
                <span>Estación KDS</span>
                <select id="stationCode" aria-label="Estación KDS" disabled></select>
            </label>
            <label id="zoneField" class="field station-field zone-field">
                <span>Zona</span>
                <select id="zoneId" aria-label="Zona KDS" disabled></select>
            </label>
            <div class="monitor-state">
                <div id="connectionStatus" class="status" role="status">
                    <span class="dot"></span>
                    <span>Sin autenticar</span>
                </div>
            </div>
            <div class="toolbar">
                <button id="refresh" type="button" disabled>Actualizar</button>
                <button id="historyButton" type="button" class="secondary hidden">Historial</button>
                <button id="logout" class="secondary" type="button">Salir</button>
            </div>
        </section>

        <p id="event"></p>
        <section id="historyPanel" class="history-panel hidden">
            <div id="historyList"></div>
        </section>
        <dialog id="ticketDialog" class="ticket-dialog" aria-labelledby="ticketTitle">
            <article id="ticketContent" class="kitchen-ticket"></article>
            <div class="ticket-actions">
                <button id="closeTicket" class="secondary" type="button">Cerrar</button>
            </div>
        </dialog>
        <section id="orders">
            <p class="empty">Accede para cargar el monitor.</p>
        </section>
    </main>

    <script type="module" src="./js/app.js?v=21"></script>
</body>

</html>
