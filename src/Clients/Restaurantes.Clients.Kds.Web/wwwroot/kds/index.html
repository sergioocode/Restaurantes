<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>KDS · Restaurantes</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/kds.css">
</head>
<body>
  <main>
    <form id="loginPanel" class="controls">
      <label class="field">
        <span>Usuario</span>
        <input id="username" autocomplete="username" value="kds.mad-centro">
      </label>
      <label class="field">
        <span>Contraseña</span>
        <input id="password" type="password" autocomplete="current-password" value="Kds-01-2026!">
      </label>
      <button id="login" type="submit">Entrar</button>
    </form>

    <section id="monitorPanel" class="controls hidden">
      <label class="field">
        <span>Local autorizado</span>
        <select id="restaurantId" aria-label="Local autorizado"></select>
      </label>
      <label class="field">
        <span>Estación KDS</span>
        <select id="stationCode" aria-label="Estación KDS" disabled></select>
      </label>
      <div class="monitor-state">
        <div id="connectionStatus" class="status" role="status">
          <span class="dot"></span>
          <span>Inicia sesión</span>
        </div>
        <p id="identityStatus" class="identity"></p>
      </div>
      <div class="toolbar">
        <button id="refresh" type="button" disabled>Actualizar</button>
        <button id="logout" class="secondary" type="button">Salir</button>
      </div>
    </section>

    <p id="event"></p>
    <section id="orders">
      <p class="empty">Inicia sesión para cargar el monitor.</p>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
