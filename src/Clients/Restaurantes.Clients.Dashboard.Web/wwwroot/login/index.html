<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Restaurantes · Acceso a informes</title>
    <style>
        :root { color-scheme: dark; font: 16px system-ui; color: #e8edf2; background: #101419 }
        * { box-sizing: border-box }
        body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 20px; background: radial-gradient(circle at top right, #263746 0, #101419 34rem) }
        main { width: min(430px, 100%); padding: 32px; border: 1px solid #2c3b49; border-radius: 16px; background: #18212b; box-shadow: 0 24px 80px #0005 }
        small { color: #9fb0c0; font-weight: 800; letter-spacing: .1em }
        h1 { margin: 8px 0; font-size: 38px }
        p { color: #9fb0c0; line-height: 1.5 }
        form, label { display: grid; gap: 9px }
        form { gap: 16px; margin-top: 24px }
        input, button { width: 100%; padding: 13px 14px; border: 1px solid #496076; border-radius: 9px; color: #fff; background: #263646; font: inherit }
        button { cursor: pointer; background: #246b47; border-color: #2f8a5d; font-weight: 850 }
        button:disabled { opacity: .55; cursor: default }
        #error { min-height: 24px; color: #ff8b85 }
    </style>
</head>
<body>
    <main>
        <small>RESTAURANTES · INFORMES</small>
        <h1>Iniciar sesión</h1>
        <p>Accede para consultar la operación y las ventas de tus locales autorizados.</p>
        <form id="loginForm">
            <label>Usuario<input id="username" autocomplete="username" value="admin" autofocus></label>
            <label>Contraseña<input id="password" type="password" autocomplete="current-password" value="Admin-2026!"></label>
            <button id="submit">Entrar al Dashboard</button>
        </form>
        <p id="error"></p>
    </main>
    <script>
        const gatewayOrigin = location.hostname === 'localhost' && (location.port === '5000' || location.port === '5600') ? 'http://localhost:5001' : location.origin;
        const sessionKey = 'restaurantes.dashboard.login';
        const saved = sessionStorage.getItem(sessionKey);
        if (saved) {
            try {
                const session = JSON.parse(saved);
                if (new Date(session.expiresAtUtc) > new Date()) location.replace('/dashboard/');
                else sessionStorage.removeItem(sessionKey)
            } catch { sessionStorage.removeItem(sessionKey) }
        }

        document.getElementById('loginForm').onsubmit = async event => {
            event.preventDefault();
            const error = document.getElementById('error');
            const submit = document.getElementById('submit');
            error.textContent = '';
            submit.disabled = true;
            try {
                const response = await fetch(gatewayOrigin + '/api/identity/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value })
                });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const session = await response.json();
                const isAdmin = (session.globalRoles || []).includes('Admin');
                const canRead = (session.restaurants || []).some(x => (x.permissions || []).includes('dashboard.read'));
                if (!isAdmin && !canRead) throw new Error('Este perfil no tiene acceso al Dashboard.');
                sessionStorage.setItem(sessionKey, JSON.stringify(session));
                location.replace('/dashboard/')
            } catch (exception) {
                error.textContent = exception.message === 'HTTP 401' ? 'Usuario o contraseña incorrectos.' : exception.message
            } finally {
                submit.disabled = false
            }
        };
    </script>
</body>
</html>
