name: Integración continua

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilar y probar la solución
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Instalar Node.js para las pruebas de KDS
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restaurar dependencias
        run: dotnet restore Restaurantes.slnx

      - name: Compilar la solución
        run: dotnet build Restaurantes.slnx --configuration Release --no-restore

      - name: Ejecutar pruebas .NET
        run: dotnet test Restaurantes.slnx --configuration Release --no-build

      - name: Ejecutar pruebas de KDS y Dashboard
        run: node --test tests/Restaurantes.Hosts.Tests/Kds/*.test.mjs tests/Restaurantes.Hosts.Tests/Dashboard/*.test.mjs
